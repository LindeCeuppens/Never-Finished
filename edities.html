<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edities — Overzicht</title>
  <!-- Matter.js voor realistische zwaartekracht en botsingen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      /* Iets hoger dan 100vh zodat de gebruiker echt kan scrollen om te schudden */
      height: 160vh; 
      background-color: #ffffff;
      overflow-x: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* Het vaste scherm waarin de fysica plaatsvindt */
    #viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transition: transform 0.05s linear;
    }

    /* Het centrale woord "EDITIES" (blijft zweven in het midden) */
    #center-title {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(42vw, 620px);
      pointer-events: none;
      z-index: 1;
      user-select: none;
    }

    #center-title img,
    #center-title svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* De klikbare editie-blokken (cijfer + ondertekst samen) */
    .edition-item {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      text-decoration: none;
      cursor: pointer;
      z-index: 10;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    .edition-item img,
    .edition-item svg {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .edition-item:hover {
      filter: brightness(0.85);
    }

    /* Subtiele scroll-hint onderaan (verdwijnt na scrollen) */
    #scroll-hint {
      position: fixed;
      bottom: 14px;
      right: 20px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0000FF;
      opacity: 0.5;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
