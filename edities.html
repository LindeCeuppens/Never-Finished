<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edities — Overzicht</title>
  <!-- Matter.js voor realistische zwaartekracht en botsingen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      /* Iets hoger dan 100vh zodat de gebruiker echt kan scrollen om te schudden */
      height: 160vh; 
      background-color: #ffffff;
      overflow-x: hidden;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    /* Het vaste scherm waarin de fysica plaatsvindt */
    #viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      transition: transform 0.05s linear;
    }

    /* Het centrale woord "EDITIES" (blijft zweven in het midden) */
    #center-title {
      position: absolute;
      top: 46%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(42vw, 620px);
      pointer-events: none;
      z-index: 1;
      user-select: none;
    }

    #center-title img,
    #center-title svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* De klikbare editie-blokken (cijfer + ondertekst samen) */
    .edition-item {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      text-decoration: none;
      cursor: pointer;
      z-index: 10;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    .edition-item img,
    .edition-item svg {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .edition-item:hover {
      filter: brightness(0.85);
    }

    /* Subtiele scroll-hint onderaan (verdwijnt na scrollen) */
    #scroll-hint {
      position: fixed;
      bottom: 14px;
      right: 20px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #0000FF;
      opacity: 0.5;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>

  <div id="viewport">
    <!-- Centrale titel uit jouw SVG -->
    <div id="center-title">
      <img src="svg/titel-edities.svg" alt="EDITIES" />
    </div>

    <!-- Alle 10 edities (cijfer + ondertekst zitten samen in één SVG zodat ze altijd samenblijven) -->
    <a href="editie01.html" class="edition-item" data-id="1" data-x="0.18" data-y="0.15" data-w="130">
      <img src="svg/editie-01.svg" alt="Editie 01" />
    </a>

    <a href="editie02.html" class="edition-item" data-id="2" data-x="0.39" data-y="0.27" data-w="135">
      <img src="svg/svg.editie-02.svg" alt="Editie 02" />
    </a>

    <a href="editie03.html" class="edition-item" data-id="3" data-x="0.65" data-y="0.15" data-w="155">
      <img src="svg/editie-03.svg" alt="Editie 03" />
    </a>

    <a href="editie04.html" class="edition-item" data-id="4" data-x="0.84" data-y="0.36" data-w="155">
      <img src="svg/editie-04.svg" alt="Editie 04" />
    </a>

    <a href="editie05.html" class="edition-item" data-id="5" data-x="0.80" data-y="0.68" data-w="135">
      <img src="svg/editie-05.svg" alt="Editie 05" />
    </a>

    <a href="editie06.html" class="edition-item" data-id="6" data-x="0.63" data-y="0.87" data-w="110">
      <img src="svg/editie-06.svg" alt="Editie 06" />
    </a>

    <a href="editie07.html" class="edition-item" data-id="7" data-x="0.47" data-y="0.69" data-w="155">
      <img src="svg/editie-07.svg" alt="Editie 07" />
    </a>

    <a href="editie08.html" class="edition-item" data-id="8" data-x="0.28" data-y="0.86" data-w="115">
      <img src="svg/editie-08.svg" alt="Editie 08" />
    </a>

    <a href="editie09.html" class="edition-item" data-id="9" data-x="0.16" data-y="0.65" data-w="165">
      <img src="svg/editie-09.svg" alt="Editie 09" />
    </a>

    <a href="editie10.html" class="edition-item" data-id="10" data-x="0.12" data-y="0.37" data-w="105">
      <img src="svg/editie-10.svg" alt="Editie 10" />
    </a>

  </div>

  <div id="scroll-hint">Scroll om te schudden</div>

  <script>
    window.addEventListener('load', () => {
      const { Engine, World, Bodies, Body, Runner } = Matter;

      const viewport = document.getElementById('viewport');
      const items = Array.from(document.querySelectorAll('.edition-item'));
      let width = window.innerWidth;
      let height = window.innerHeight;

      // 1. Physics Engine aanmaken (start met zwaartekracht = 0)
      const engine = Engine.create();
      engine.gravity.y = 0;

      // Muren & vloer rondom het scherm (zodat niets uit beeld valt)
      const wallThickness = 110;
      let ground = Bodies.rectangle(width / 1, height + wallThickness / 1 - 6, width * 2, wallThickness, {
        isStatic: true,
        restitution: 0.45,
        friction: 0.6
      });
      let leftWall = Bodies.rectangle(-wallThickness / 1, height / 1, wallThickness, height * 2, {
        isStatic: true,
        restitution: 0.4
      });
      let rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 3, {
        isStatic: true,
        restitution: 0.4
      });

      World.add(engine.world, [ground, leftWall, rightWall]);

      // 2. Elk SVG-blok omzetten naar een fysiek lichaam op zijn exacte startpositie
      const editionBodies = items.map((el) => {
        const startX = parseFloat(el.dataset.x) * width;
        const startY = parseFloat(el.dataset.y) * height;
        // Schaal breedte mee met schermgrootte (referentie 1440px breed)
        const scaleFactor = Math.max(2, Math.min(1.2, width / 1440));
        const itemWidth = parseFloat(el.dataset.w) * scaleFactor;
        el.style.width = `${itemWidth}px`;

        // Werkelijke hoogte ophalen nadat de afbeelding geladen is
        const rect = el.getBoundingClientRect();
        const itemHeight = rect.height || itemWidth * 1.1;

        const body = Bodies.rectangle(startX, startY, itemWidth * 0.6, itemHeight * 0.6, {
          restitution: 0.42,     // Lichte stuit bij neerkomen
          friction: 0.5,         // Wrijving zodat ze op elkaar blijven liggen
          frictionAir: 0.015,    // Luchtweerstand
          density: 0.002,
          chamfer: { radius: 8 } // Afgeronde hoeken zodat ze natuurlijk kantelen zoals in beeld 2
        });

        // Initieel op de exacte positie zetten
        el.style.transform = `translate(${startX - itemWidth / 2}px, ${startY - itemHeight / 2}px) rotate(0deg)`;

        return { el, body, w: itemWidth, h: itemHeight };
      });

      World.add(engine.world, editionBodies.map(item => item.body));

      // Start de physics loop
      const runner = Runner.create();
      Runner.run(runner, engine);

      // 3. Synchroniseer HTML/SVG-elementen met de physics-posities
      let hasFallen = false;

      function updateRender() {
        editionBodies.forEach(({ el, body, w, h }) => {
          const x = body.position.x - w / 2;
          const y = body.position.y - h / 2;
          const angle = body.angle;
          el.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad)`;
        });
        requestAnimationFrame(updateRender);
      }
      requestAnimationFrame(updateRender);

      // 4. Na exact 1 seconde: zwaartekracht inschakelen!
      setTimeout(() => {
        engine.gravity.y = 1.15;
        hasFallen = true;

        // Geef elk cijfer een heel subtiel duwtje/draaiing zodat ze natuurlijk neerkomen en stapelen
        editionBodies.forEach(({ body }) => {
          Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.04);
          Body.setVelocity(body, {
            x: (Math.random() - 0.5) * 1.5,
            y: Math.random() * 1.2
          });
        });
      }, 1000);

      // 5. Bij scrollen: scherm schudt zacht & cijfers rommelen op en liggen daarna weer stil
      let lastScrollY = window.scrollY;
      let shakeTimeout = null;
      const scrollHint = document.getElementById('scroll-hint');

      window.addEventListener('scroll', () => {
        if (!hasFallen) return;

        if (scrollHint) {
          scrollHint.style.opacity = '0';
        }

        const currentScrollY = window.scrollY;
        const delta = Math.min(Math.abs(currentScrollY - lastScrollY), 60);
        lastScrollY = currentScrollY;

        if (delta < 2) return;

        // Zachte visuele trilling van het scherm zelf
        const shakeX = (Math.random() - 0.5) * 8;
        const shakeY = (Math.random() - 0.5) * 8;
        viewport.style.transform = `translate(${shakeX}px, ${shakeY}px)`;

        clearTimeout(shakeTimeout);
        shakeTimeout = setTimeout(() => {
          viewport.style.transform = 'translate(0px, 0px)';
        }, 120);

        // Laat de cijfers en hun ondertekst opschudden en rommelen
        const forceMultiplier = Math.max(0.35, delta / 45);
        editionBodies.forEach(({ body }) => {
          // Alleen extra impuls geven als ze niet al te hoog vliegen
          if (body.position.y > height * 0.45) {
            Body.setVelocity(body, {
              x: body.velocity.x + (Math.random() - 0.5) * 4.5 * forceMultiplier,
              y: - (2.5 + Math.random() * 4.5) * forceMultiplier
            });
            Body.setAngularVelocity(
              body,
              body.angularVelocity + (Math.random() - 0.5) * 0.09 * forceMultiplier
            );
          }
        });
      }, { passive: true });

      // 6. Schermformaat aanpassen (responsive)
      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;

        Body.setPosition(ground, { x: width / 2, y: height + wallThickness / 2 - 8 });
        Body.setPosition(rightWall, { x: width + wallThickness / 2, y: height / 2 });
      });
    });
  </script>
</body>
</html>
