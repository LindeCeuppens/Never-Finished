  <title>Editie 01 — Transport per dag - Okt 2026</title>
  
  <!-- Adobe Typekit (Massilia Medium) -->

  <style>
    :root {
      --blue: #0000FF;
      --white: #FFFFFF;
      --font-sans: "massilia", sans-serif;
      --font-serif: "instrument-serif", "Instrument Serif", serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--white);
      color: var(--blue);
      font-family: var(--font-sans);
      font-weight: 500;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- TOP HEADER (Overzicht) --- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 24px 32px;
      height: 32vh;
      min-height: 180px;
    }

    .back-link {
      color: var(--blue);
      text-decoration: none;
      font-size: 28px;
      line-height: 1;
      transition: transform 0.2s ease;
      display: inline-flex;
      align-items: center;
    }

    .back-link:hover {
      transform: translateX(-4px);
    }

    .badge {
      border: 2px solid var(--blue);
      padding: 8px 14px;
      font-size: 16px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* --- DAGEN LIJST --- */
    .days-list {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      border-top: 2px solid var(--blue);
    }

    .day-row {
      position: relative;
      width: 100%;
      height: 11.3vh; /* Zorgt ervoor dat de onderkant van de tekst netjes afgesneden wordt */
      min-height: 82px;
      border-bottom: 2px solid var(--blue);
      background-color: var(--white);
      color: var(--blue);
      overflow: hidden;
      cursor: pointer;
      transition: background-color 0.25s ease, color 0.25s ease;
      user-select: none;
    }

    .day-title {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: clamp(3.4rem, 7.6vw, 7.2rem);
      line-height: 0.88;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      padding-left: 16px;
      /* Standaard staat de tekst iets lager zodat de onderkant door overflow:hidden wordt afgesneden */
      transform: translateY(16px);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .day-row:hover {
      background-color: var(--blue);
      color: var(--white);
    }
